[package]
name = "buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
ml-core = { path = "../crates/ml-core" }
ml-eq = { path = "../crates/ml-eq" }
ml-rgb = { path = "../crates/ml-rgb" }
ml-fans = { path = "../crates/ml-fans" }
wasapi = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-drag = "2.1.1"
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
tauri-plugin-updater = "2"
